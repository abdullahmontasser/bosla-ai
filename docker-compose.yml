services:
  postgres:
    image: postgres:16-alpine
    container_name: careercraft-postgres
    restart: always
    environment:
      POSTGRES_USER: careercraft
      POSTGRES_PASSWORD: careercraft_dev_password
      POSTGRES_DB: careercraft_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
